plugins {
    id 'com.android.application'
}

android {
    namespace 'xyz.waozi.pass'
    compileSdk 36
    ndkVersion "28.2.13676358"

    sourceSets {
        main.java.srcDirs += '../../vendor/kryon/src/platform/android/java'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    def keystorePropsFile = rootProject.file("local.properties")
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystoreProps.load(new FileInputStream(keystorePropsFile))
    }

    def getKeystorePath = { -> project.findProperty('keystore.path') ?: keystoreProps['keystore.path'] ?: System.getenv("HOME") + "/.android/pass-release.keystore" }
    def getKeystoreAlias = { -> project.findProperty('keystore.alias') ?: keystoreProps['keystore.alias'] ?: "pass-key" }

    def releasePassword = project.findProperty('keystore.password') ?: ""

    def releaseKeystorePath = getKeystorePath()
    def releaseKeystore = releaseKeystorePath ? file(releaseKeystorePath) : null
    // Sign release builds only when a keystore is actually available: CI and
    // local release builds pass -Pkeystore.* properties, while clean checkouts
    // (for example an F-Droid builder) produce an unsigned APK instead.
    def signRelease = !project.hasProperty('fDroidBuild') \
        && releaseKeystore != null && releaseKeystore.exists() \
        && releasePassword != ""

    signingConfigs {
        release {
            if (signRelease) {
                storeFile releaseKeystore
                storePassword releasePassword
                keyAlias getKeystoreAlias()
                keyPassword releasePassword
            }
        }
    }

    defaultConfig {
        applicationId 'xyz.waozi.pass'
        minSdk 21
        targetSdk 36
        versionCode 10
        versionName "0.2.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Default to the two realistic phone targets; override with
        // -Pabi=x86_64 etc. for emulator builds.
        def abis = project.findProperty('abi') ?: 'armeabi-v7a,arm64-v8a'
        ndk {
            abis.split(',').collect { it.trim() }.each { abiFilters it }
        }
    }

    splits {
        abi {
            enable = (project.findProperty('splitApks') ?: 'false').toString().toBoolean()
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    buildTypes {
        release {
            signingConfig signRelease ? signingConfigs.release : null
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    dependenciesInfo {
        includeInApk = false
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
