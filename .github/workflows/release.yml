name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard-submodule-urls:
    name: Submodule URLs are public HTTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reject non-HTTPS submodule URLs
        run: scripts/check_submodule_urls.sh

  cli:
    name: CLI (${{ matrix.arch }})
    needs: guard-submodule-urls
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build archive
        run: |
          set -euo pipefail
          make cli
          name="pass-cli-linux-${{ matrix.arch }}"
          mkdir -p "build/release/$name"
          cp pass LICENSE README.md "build/release/$name/"
          tar -C build/release -czf "build/release/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.arch }}
          path: build/release/pass-cli-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  gui:
    name: GUI (${{ matrix.arch }})
    needs: guard-submodule-urls
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native dependencies
        run: |
          mapfile -t packages < .github/apt/gui-packages.txt
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
      - run: make gui
      - name: Package GUI tarball and Debian package
        run: |
          name="pass-gui-linux-${{ matrix.arch }}"
          mkdir -p "build/release/$name"
          cp build/pass-gui LICENSE README.md "build/release/$name/"
          tar -C build/release -czf "build/release/$name.tar.gz" "$name"
          make package-deb
      - name: Package AppImage
        run: |
          case "${{ matrix.arch }}" in
            amd64) ld_arch=x86_64 ;;
            arm64) ld_arch=aarch64 ;;
          esac
          curl -fL "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ld_arch}.AppImage" -o build/linuxdeploy.AppImage
          chmod +x build/linuxdeploy.AppImage
          (cd build && ./linuxdeploy.AppImage --appimage-extract >/dev/null)
          make package-appimage LINUXDEPLOY="$PWD/build/squashfs-root/AppRun" APPIMAGE_ARCH="$ld_arch"
      - uses: actions/upload-artifact@v4
        with:
          name: gui-linux-${{ matrix.arch }}
          path: |
            build/release/pass-gui-linux-${{ matrix.arch }}.tar.gz
            build/release/*.deb
            build/release/*.AppImage
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: guard-submodule-urls
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/34.0.0
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-api36-bt34-ndk28-cmake322
          restore-keys: |
            android-sdk-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Android native build
        uses: actions/cache@v4
        with:
          path: |
            droid/app/.cxx
            droid/app/build/intermediates/cxx
          key: android-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('droid/app/src/main/cpp/CMakeLists.txt', 'droid/app/build.gradle', 'native/*.c', 'droid/app/src/main/cpp/*.c', 'vendor/kryon/src/**/*.c', 'vendor/kryon/include/**/*.h', 'vendor/kryon/vendor/raylib/src/**') }}
          restore-keys: |
            android-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Prepare Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is empty or missing"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.android/pass-release.keystore"
      - name: Build release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::KEYSTORE_PASSWORD secret is empty or missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::KEY_ALIAS secret is empty or missing"; exit 1; }
          chmod +x droid/gradlew
          make kry-c
          ./droid/gradlew -p droid assembleRelease \
            -PsplitApks=true \
            -Pkeystore.path="$HOME/.android/pass-release.keystore" \
            -Pkeystore.alias="$KEY_ALIAS" \
            -Pkeystore.password="$KEYSTORE_PASSWORD" \
            --stacktrace
          mkdir -p build/release
          cp droid/app/build/outputs/apk/release/app-universal-release.apk build/release/pass-android.apk
          cp droid/app/build/outputs/apk/release/app-arm64-v8a-release.apk build/release/pass-android-arm64-v8a.apk
          cp droid/app/build/outputs/apk/release/app-armeabi-v7a-release.apk build/release/pass-android-armeabi-v7a.apk
          test -s build/release/pass-android.apk
          test -s build/release/pass-android-arm64-v8a.apk
          test -s build/release/pass-android-armeabi-v7a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/release/pass-android*.apk
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    needs: guard-submodule-urls
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Emscripten
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EM_CONFIG=$HOME/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - run: make site
      - run: cd build/site && zip -qr ../pass-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/pass-web.zip
          if-no-files-found: error

  publish:
    needs: [cli, gui, web, android]
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          path: build/artifacts
          merge-multiple: true
      - id: version
        name: Resolve release version
        run: |
          set -euo pipefail
          version=$(sed -n '1p' VERSION)
          test -n "$version"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate Update Appcast
        if: steps.version.outputs.released == 'true'
        run: |
          set -euo pipefail
          VERSION=$(sed -n '1p' VERSION)
          TAG="v$VERSION"
          BASE="https://github.com/waozixyz/pass/releases/download/$TAG"
          # appcast channel names use dpkg arch naming (amd64/arm64);
          # the artifacts use uname -m naming (x86_64/aarch64)
          arch_name() {
            case "$1" in
              x86_64) echo amd64 ;;
              aarch64|arm64) echo arm64 ;;
              *) echo "$1" ;;
            esac
          }
          channels=()
          for img in build/artifacts/*.AppImage; do
            [ -e "$img" ] || continue
            arch=$(basename "$img" | sed -n 's/^pass-.*-\([^-]*\)\.AppImage$/\1/p')
            channels+=("--channel" "appimage-$(arch_name "$arch")=$img")
          done
          DEB="$(find build/artifacts -maxdepth 1 -name '*.deb' -print -quit || true)"
          TAR="$(find build/artifacts -maxdepth 1 -name 'pass-gui-linux-*.tar.gz' -print -quit || true)"
          [ -n "$DEB" ] && channels+=("--channel" "deb=$DEB")
          [ -n "$TAR" ] && channels+=("--channel" "tarball=$TAR")
          if [ ${#channels[@]} -eq 0 ]; then
            echo "no release artifacts found for the appcast"
            exit 1
          fi
          python3 vendor/kryon/scripts/make_appcast.py \
            --version "$VERSION" \
            --base-url "$BASE" \
            --notes-url "https://github.com/waozixyz/pass/releases/tag/$TAG" \
            --changelog CHANGELOG.md \
            --out build/artifacts/appcast.json \
            "${channels[@]}"
      - name: Publish checksums
        if: steps.version.outputs.released == 'true'
        run: |
          set -euo pipefail
          cd build/artifacts
          # The glob expands before the redirect creates SHA256SUMS itself.
          sha256sum -- * > SHA256SUMS
      - name: Create release tag
        if: steps.version.outputs.released == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Publish GitHub release
        if: steps.version.outputs.released == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: build/artifacts/*
