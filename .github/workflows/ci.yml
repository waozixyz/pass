name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-submodule-urls:
    name: Submodule URLs are public HTTPS
    runs-on: ubuntu-latest
    steps:
      # Plain checkout on purpose: the guard validates URLs before allowing
      # recursive submodule checkout to continue.
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reject non-HTTPS submodule URLs
        run: scripts/check_submodule_urls.sh

  test:
    runs-on: ubuntu-latest
    needs: guard-submodule-urls
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Emscripten
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EM_CONFIG=$HOME/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Test C CLI, core, and Kry generator
        run: make test
      - name: Build browser app
        run: make site
      - name: Verify generated site
        run: |
          test -s build/site/index.html
          test -s build/site/app/index.html
          test -s build/site/app/index.wasm
      - name: Check fastlane metadata
        run: |
          set -eu
          meta=fastlane/metadata/android/en-US
          limit() {
            n=$(wc -m < "$1")
            if [ "$n" -gt "$2" ]; then
              echo "::error::$1 is $n characters (max $2)"
              exit 1
            fi
          }
          limit "$meta/title.txt" 30
          limit "$meta/short_description.txt" 80
          limit "$meta/full_description.txt" 4000
          for f in "$meta"/changelogs/*.txt; do
            limit "$f" 500
          done
          code=$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\)$/\1/p' droid/app/build.gradle | head -n 1)
          test -n "$code"
          test -s "$meta/changelogs/$code.txt"
          test -s "$meta/images/icon.png"
          echo "fastlane metadata ok (versionCode $code)"

  build-gui:
    name: GUI (${{ matrix.arch }})
    needs: guard-submodule-urls
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native dependencies
        run: |
          mapfile -t packages < .github/apt/gui-packages.txt
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
      - name: Build GUI
        run: make gui
      - name: Build Debian package
        run: make package-deb
      - uses: actions/upload-artifact@v4
        with:
          name: pass-gui-linux-${{ matrix.arch }}
          path: build/pass-gui
          if-no-files-found: error

  build-android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: guard-submodule-urls
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-36
            ${{ env.ANDROID_HOME }}/build-tools/34.0.0
            ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
            ${{ env.ANDROID_HOME }}/cmake/3.22.1
          key: android-sdk-${{ runner.os }}-${{ runner.arch }}-api36-bt34-ndk28-cmake322
          restore-keys: |
            android-sdk-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Android native build
        uses: actions/cache@v4
        with:
          path: |
            droid/app/.cxx
            droid/app/build/intermediates/cxx
          key: android-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/*.kry', 'droid/app/src/main/cpp/CMakeLists.txt', 'droid/app/build.gradle', 'native/*.c', 'droid/app/src/main/cpp/*.c', 'vendor/kryon/src/**/*.c', 'vendor/kryon/include/**/*.h', 'vendor/kryon/vendor/raylib/src/**') }}
          restore-keys: |
            android-native-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build debug APK
        run: |
          set -euo pipefail
          chmod +x droid/gradlew
          make android-debug

  android-input-test:
    name: Android input instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: guard-submodule-urls
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Run Android input tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            bash <<'EOF'
            set -euo pipefail
            chmod +x droid/gradlew
            make android-input-test
            EOF
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-input-test-reports
          path: |
            droid/app/build/reports/androidTests/
            droid/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
