name: Cloudflare Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-submodule-urls:
    name: Submodule URLs are public HTTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reject non-HTTPS submodule URLs
        run: scripts/check_submodule_urls.sh

  build:
    needs: guard-submodule-urls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Emscripten
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EM_CONFIG=$HOME/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Build Site
        run: |
          set -euo pipefail
          make site
          test -s build/site/index.html
          test -s build/site/app/index.html
          test -s build/site/app/index.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: pass-site
          path: build/site
          if-no-files-found: error

  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pass-site
          path: build/site
      - name: Deploy Preview To Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/site --project-name=pass --branch=${{ github.head_ref || github.ref_name }}

  deploy-production:
    name: Deploy Production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pass-site
          path: build/site
      - name: Deploy Production To Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/site --project-name=pass --branch=master
