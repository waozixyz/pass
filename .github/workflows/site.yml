name: Netlify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-submodule-urls:
    name: Submodule URLs are public HTTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Reject non-HTTPS submodule URLs
        run: scripts/check_submodule_urls.sh

  build:
    needs: guard-submodule-urls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Emscripten
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          echo "EM_CONFIG=$HOME/emsdk/.emscripten" >> "$GITHUB_ENV"
          echo "$HOME/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Build Site
        run: |
          set -euo pipefail
          make site
          test -s build/site/index.html
          test -s build/site/app/index.html
          test -s build/site/app/index.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: pass-site
          path: build/site
          if-no-files-found: error

  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pass-site
          path: build/site
      - name: Install Netlify CLI
        run: npm install --global netlify-cli
      - name: Deploy Preview To Netlify
        run: |
          set -euo pipefail
          auth_token="$(printf '%s' "$NETLIFY_AUTH_TOKEN" | tr -d '\r\n')"
          site_id="$(printf '%s' "$NETLIFY_SITE_ID" | tr -d '\r\n')"
          netlify deploy \
            --dir build/site \
            --no-build \
            --alias "pr-${{ github.event.pull_request.number }}" \
            --message "Preview ${{ github.event.pull_request.number }}" \
            --auth "$auth_token" \
            --site "$site_id"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-production:
    name: Deploy Production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pass-site
          path: build/site
      - name: Package Site
        run: |
          set -euo pipefail
          test -s build/site/index.html
          cd build/site
          zip -qr ../pass-site.zip .
          test -s ../pass-site.zip
      - name: Deploy Production To Netlify
        run: |
          set -euo pipefail
          auth_token="$(printf '%s' "$NETLIFY_AUTH_TOKEN" | tr -d '\r\n')"
          site_id="$(printf '%s' "$NETLIFY_SITE_ID" | tr -d '\r\n')"
          test -n "$auth_token" || { echo "::error::NETLIFY_AUTH_TOKEN is empty or missing"; exit 1; }
          test -n "$site_id" || { echo "::error::NETLIFY_SITE_ID is empty or missing"; exit 1; }

          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $auth_token" \
            -H "Content-Type: application/zip" \
            --data-binary "@build/pass-site.zip" \
            "https://api.netlify.com/api/v1/sites/$site_id/deploys")"

          python3 -c 'import json, sys; deploy = json.loads(sys.argv[1]); state = deploy.get("state", ""); url = deploy.get("ssl_url") or deploy.get("url") or deploy.get("deploy_ssl_url") or deploy.get("deploy_url") or deploy.get("id"); print(f"Netlify deploy {state}: {url}"); raise SystemExit(1 if state in ("error", "failed") else 0)' "$response"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
