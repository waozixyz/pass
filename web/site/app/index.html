<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pass</title>
  <meta name="theme-color" content="#f7ede2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script>
    const previewQuery = new URLSearchParams(location.search);
    if (previewQuery.has('mini') && previewQuery.get('theme') === 'waozi') {
      document.documentElement.dataset.embedTheme = 'waozi';
      document.querySelector('meta[name="theme-color"]').content = '#f7f3eb';
    }
  </script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f7ede2;
      color: #4a4038;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    .canvas-stage, .canvas-frame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #f7ede2;
    }
    canvas.emscripten {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      border: 0;
      outline: 0;
      background: #f7ede2;
    }
    :root[data-embed-theme="waozi"],
    :root[data-embed-theme="waozi"] body,
    :root[data-embed-theme="waozi"] .canvas-stage,
    :root[data-embed-theme="waozi"] .canvas-frame,
    :root[data-embed-theme="waozi"] canvas { background: #f7f3eb; color: #202c29; }
  </style>
</head>
<body>
  <div class="canvas-stage">
    <div class="canvas-frame" id="canvas-frame">
      <canvas class="emscripten" id="canvas" width="720" height="740" tabindex="-1"></canvas>
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
